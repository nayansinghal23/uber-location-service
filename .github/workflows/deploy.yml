
name: UberLocationService CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build and Test Location Service
        run: |
          chmod +x gradlew
          ./gradlew clean build

      - name: Upload Executable JAR
        uses: actions/upload-artifact@v4
        with:
          name: uber-location-jar
          path: build/libs/UberLocationService-0.0.1-SNAPSHOT.jar
          if-no-files-found: error

  deploy:
    name: Deploy to EC2
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Download Executable JAR
        uses: actions/download-artifact@v4
        with:
          name: uber-location-jar
          path: deploy

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Upload JAR to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            deploy/UberLocationService-0.0.1-SNAPSHOT.jar \
            "$EC2_USER@$EC2_HOST:/tmp/uber-location-app.jar"

      - name: Deploy and Restart Service
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            "$EC2_USER@$EC2_HOST" \
            'sudo /usr/local/sbin/deploy-uber-location.sh'
